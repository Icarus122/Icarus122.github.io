<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我们的心动收藏</title>
  <style>
    :root{--ink:#fff9ef;--gold:#ffd991}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;background:#101a38}.page{min-height:100vh;overflow:hidden;position:relative;padding-bottom:44px;background:radial-gradient(circle at 15% 20%,#67365f 0,transparent 29rem),radial-gradient(circle at 84% 75%,#264c70 0,transparent 28rem),#101a38}.topbar,.hero,.cards,.note,footer{position:relative;z-index:1;max-width:1120px;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;padding:26px 32px;font-size:.88rem;letter-spacing:.08em}.brand{margin:0;color:#ffe6b2;font-weight:700}.back{color:#ffe0a1;text-decoration:none}.hero{padding:58px 32px 38px}.eyebrow{margin:0 0 16px;color:var(--gold);font-size:.74rem;font-weight:700;letter-spacing:.18em}.hero h1{max-width:680px;margin:0;font:500 clamp(3.1rem,6.2vw,5.8rem)/1.12 Georgia,"Songti SC",serif;letter-spacing:-.04em}.hero>p:last-child{max-width:520px;color:#dfe6ff;font-size:1.08rem;line-height:1.9}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:12px 32px 30px}.card{position:relative;min-height:270px;padding:28px;overflow:hidden;text-align:left;color:var(--ink);border:1px solid #fff3ca38;border-radius:22px;background:linear-gradient(145deg,#ffffff16,#ffffff08);cursor:pointer;transition:.25s}.card:hover{transform:translateY(-8px);border-color:#ffe0a180;background:linear-gradient(145deg,#ffffff24,#ffffff0e)}.index{display:block;color:var(--gold);font:1.1rem Georgia,serif;letter-spacing:.12em}.heart{position:absolute;top:18px;right:22px;color:#ffb9c4;font:3.2rem/1 Georgia,serif}.card h2{margin:68px 0 12px;font:1.7rem Georgia,"KaiTi",serif}.card p{min-height:52px;margin:0;color:#e4eaff;line-height:1.75}.open{position:absolute;bottom:25px;color:#ffe0a1;font-size:.9rem}.note{display:flex;gap:16px;align-items:center;max-width:670px;margin-top:8px;padding:19px 25px;border:1px solid #ffd99150;border-radius:999px;background:#fff8e915;color:#fff5df}.note span{color:#ffbac4;font-size:1.7rem}.note p{margin:0;line-height:1.55}footer{padding:45px 32px 0;color:#dfe6ff99;text-align:center;font-size:.85rem}.glow{position:absolute;width:240px;height:240px;border-radius:50%;filter:blur(8px);opacity:.35}.one{top:130px;left:-110px;background:#ff9baa}.two{right:-70px;bottom:30px;background:#79b5e0}@media(max-width:720px){.topbar{padding:20px}.hero{padding:42px 22px 25px}.cards{grid-template-columns:1fr;padding:10px 20px 24px}.card{min-height:235px}.note{align-items:flex-start;margin:0 20px;border-radius:22px}footer{padding:38px 20px 0}}
  </style>
</head>
<body><main class="page"><div class="glow one"></div><div class="glow two"></div><nav class="topbar"><p class="brand">♥ 给王振华</p><a class="back" href="/">← 回到情书</a></nav><section class="hero"><p class="eyebrow">✦ OUR LITTLE ARCHIVE</p><h1>把喜欢，<br>收藏成很多个瞬间。</h1><p>这里没有盛大的故事，只有一些一想起来就会微笑的小确幸。</p></section><section class="cards" aria-label="心动收藏"><button class="card" data-note="从那天开始，平常的晚风也变得值得期待。"><span class="index">01</span><span class="heart">♡</span><h2>第一次心动</h2><p>从那天开始，平常的晚风也变得值得期待。</p><span class="open">点开收藏 →</span></button><button class="card" data-note="不是一定要说很多话，想到你就已经很开心。"><span class="index">02</span><span class="heart">♡</span><h2>想念的时候</h2><p>不是一定要说很多话，想到你就已经很开心。</p><span class="open">点开收藏 →</span></button><button class="card" data-note="希望以后的很多个小日子，都有你在身边。"><span class="index">03</span><span class="heart">♡</span><h2>未来的约定</h2><p>希望以后的很多个小日子，都有你在身边。</p><span class="open">点开收藏 →</span></button></section><aside class="note" aria-live="polite"><span>♡</span><p id="note">点开一张卡片，收下一句只写给你的话。</p></aside><footer>给王振华的星光情书 · 今天也想认真喜欢你</footer></main><script>document.querySelectorAll('.card').forEach((card,i)=>card.addEventListener('click',()=>document.querySelector('#note').textContent=`第 ${i+1} 张收藏：${card.dataset.note}`));</script></body>
</html>
